spring.application.name=budget-api

# --- Connexion base de données (Railway en prod, MySQL local en dev) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/budget_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:budget-user}
spring.datasource.password=${DB_PASSWORD:12user@sido}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuration JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Configuration JWT ---
jwt.secret=${JWT_SECRET:maSuperCleSecretePourSignerLesTokensJWT2026BudgetApiSidoniesoft}
jwt.expiration=86400000

# --- Port (Railway injecte $PORT automatiquement) ---
server.port=${PORT:8080}